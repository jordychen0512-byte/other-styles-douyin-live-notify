name: Check Other Styles Douyin Live

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: other-styles-douyin-live-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Reuse the runner tool cache instead of downloading via streamget install-node.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: false
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 2
        run: python -m pip install --retries 5 --timeout 20 --requirement requirements.txt

      - name: Verify Node.js runtime
        shell: python
        run: |
          import subprocess
          import execjs
          from streamget.scripts.node_setup import check_nodejs_installed

          subprocess.run(["node", "--version"], check=True, timeout=10)
          assert check_nodejs_installed(), "streamget cannot find Node.js on PATH"
          runtime = execjs.get("Node")
          assert runtime.eval("1 + 1") == 2, "Node.js JavaScript execution failed"
          print("streamget and Python JavaScript runtime can use Node.js.")

      - name: Check Douyin live status
        run: python monitor.py

      - name: Save live state
        run: |
          if [ ! -f state.json ]; then
            echo "::error::state.json is missing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Live state did not change."
            exit 0
          fi
          git commit -m "Update live state"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "::error::Live state conflicts with a remote update; remote data was not overwritten."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "::warning::State push attempt $attempt failed."
          done
          echo "::error::Could not save live state after 3 attempts."
          exit 1

      - name: Notify Discord when the monitor fails
        if: ${{ failure() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg content "⚠️ 其他流派抖音直播監測失敗：${RUN_URL}" \
            '{content: $content}')
          curl --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
