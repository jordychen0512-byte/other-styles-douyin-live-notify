name: Check Other Styles Douyin Live

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: other-styles-douyin-live-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 2
        run: |
          python -m pip install --retries 5 --timeout 20 --requirement requirements.txt

      - name: Install Node.js with retries
        shell: python
        run: |
          import subprocess
          import time

          for attempt in range(1, 4):
              print(f"Installing Node.js (attempt {attempt}/3)", flush=True)
              try:
                  subprocess.run(["streamget", "install-node"], check=True, timeout=45)
                  break
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  if attempt == 3:
                      raise SystemExit("Node.js installation failed after 3 attempts.") from error
                  print(f"::warning::Node.js installation failed: {error}. Retrying...", flush=True)
                  time.sleep(5 * attempt)

      - name: Check Douyin live status
        run: python monitor.py

      - name: Save live state
        run: |
          if [ ! -f state.json ]; then
            echo "::error::state.json is missing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Live state did not change."
            exit 0
          fi
          git commit -m "Update live state"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "::error::Live state conflicts with a remote update; remote data was not overwritten."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "::warning::State push attempt $attempt failed."
          done
          echo "::error::Could not save live state after 3 attempts."
          exit 1

      - name: Notify Discord when the monitor fails
        if: ${{ failure() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg content "⚠️ 其他流派抖音直播監測失敗：${RUN_URL}" \
            '{content: $content}')
          curl --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
